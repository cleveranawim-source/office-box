<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Noto Sans KR",sans-serif;background:#F4F5F7;color:#111827;display:flex}
.side{width:240px;background:#fff;border-right:1px solid #E5E7EB;padding:24px 16px;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:700;font-size:16px;padding:0 10px 18px}
.side a{padding:9px 10px;border-radius:8px;font-size:14px;color:#374151;text-decoration:none}
.side a.on{background:#EFF4FF;color:#2563EB;font-weight:700}
main{flex:1;padding:40px 48px}
h1{font-size:26px;font-weight:700}
.sub{color:#6B7280;margin:6px 0 28px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:10px;min-height:250px}
.ic{width:40px;height:40px;border-radius:10px;background:#EFF4FF}
.card h2{font-size:18px;font-weight:700}
.card p{font-size:14px;color:#6B7280;line-height:1.6}
.meta{font-size:13px;color:#374151}
.badge{align-self:flex-start;background:#FEF3C7;color:#92400E;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.btn{margin-top:auto;align-self:flex-start;background:#2563EB;color:#fff;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:700}
</style></head><body>
<aside class="side"><div class="logo">교무자동화도구 박스</div><a class="on" href="#">홈</a><a href="#">학사일정 자동생성</a><a href="#">시수계산</a><a href="#">범교과 편성</a><a href="#">반배정</a><a href="#" style="margin-top:auto">설정</a></aside>
<main><h1>안녕하세요, 선생님</h1><p class="sub">2027학년도 · 사용할 도구를 고르세요</p>
<div class="grid">
 <div class="card"><div class="ic"></div><h2>연간 학사일정 자동생성</h2><p>작년 학사일정 시트로 새해 일정을 자동 배치합니다.</p><span class="meta">205건 배치됨</span><span class="badge">확인 필요 13</span><span class="btn">열기</span></div>
 <div class="card"><div class="ic"></div><h2>시수계산</h2><p>휴일·행사로 줄어드는 시수를 계산합니다.</p><span class="meta">27개 반</span><span class="badge">해석 필요 10</span><span class="btn">열기</span></div>
 <div class="card"><div class="ic"></div><h2>범교과 필수교육 편성</h2><p>필수교육을 교과·창체에 연결합니다.</p><span class="meta">12 / 18 연결</span><span class="btn">열기</span></div>
 <div class="card"><div class="ic"></div><h2>반배정</h2><p>조건에 맞춰 반을 배정합니다.</p><span class="meta">명단 없음</span><span class="btn">열기</span></div>
</div></main>
</body></html>
